<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta id="vp" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script>
        // Celulares em paisagem têm só ~850×390 px CSS: o editor foi desenhado para 1200×560.
        // Na casca Android, renderiza em 1200 px de largura e reduz para caber (como uma janela de PC).
        (function () {
            var narrow = Math.max(screen.width, screen.height) < 1200;
            if (narrow && /Android/i.test(navigator.userAgent)) {
                document.getElementById("vp").setAttribute("content", "width=1200, user-scalable=no, viewport-fit=cover");
            }
        })();
    </script>
    <title>MZ Editor</title>
    <link rel="icon" href="img/app.png" type="image/png">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <!-- Barra de menus do MZ (01_04): preenchida por js/menubar.js -->
    <nav id="menubar"></nav>
    <!-- Barra de ferramentas na ordem do RPG Maker MZ, com os ícones originais -->
    <header id="toolbar">
        <button id="btnMaps" class="tb" title="Show/hide map list" data-i18n-title="Show/hide map list"><img src="img/tree-root.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnNew" class="tb" title="New Project" data-i18n-title="New Project" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/file-new.png" alt=""></button>
        <button id="btnOpen" class="tb" title="Open Project" data-i18n-title="Open Project" data-i18n-ctx="MainMenu"><img src="img/toolbar/file-open.png" alt=""></button>
        <button id="btnSave" class="tb" title="Save Project" data-i18n-title="Save Project" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/file-save.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnUndo" class="tb" title="Undo" data-i18n-title="Undo" data-i18n-ctx="BasicConstants" disabled><img src="img/toolbar/edit-undo.png" alt=""></button>
        <button id="btnCut" class="tb" title="Cut" data-i18n-title="Cut" data-i18n-ctx="BasicConstants" disabled><img src="img/toolbar/edit-cut.png" alt=""></button>
        <button id="btnCopy" class="tb" title="Copy" data-i18n-title="Copy" data-i18n-ctx="BasicConstants" disabled><img src="img/toolbar/edit-copy.png" alt=""></button>
        <button id="btnPaste" class="tb" title="Paste" data-i18n-title="Paste" data-i18n-ctx="BasicConstants" disabled><img src="img/toolbar/edit-paste.png" alt=""></button>
        <button id="btnDelete" class="tb" title="Delete" data-i18n-title="Delete" data-i18n-ctx="BasicConstants" disabled><img src="img/toolbar/edit-delete.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnModeMap" class="tb toggle on" title="Map" data-i18n-title="Map" data-i18n-ctx="MainMenu"><img src="img/toolbar/mode-map.png" alt=""></button>
        <button id="btnModeEvent" class="tb toggle" title="Event" data-i18n-title="Event" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/mode-event.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnPencil" class="tb toggle" title="Pencil" data-i18n-title="Pencil" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/draw-pencil.png" alt=""></button>
        <button id="btnRect" class="tb toggle" title="Rectangle" data-i18n-title="Rectangle" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/draw-rectangle.png" alt=""></button>
        <button id="btnEllipse" class="tb toggle" title="Ellipse" data-i18n-title="Ellipse" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/draw-ellipse.png" alt=""></button>
        <button id="btnFill" class="tb toggle" title="Flood Fill" data-i18n-title="Flood Fill" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/draw-floodfill.png" alt=""></button>
        <button id="btnShadow" class="tb toggle" title="Shadow Pen" data-i18n-title="Shadow Pen" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/draw-shadowpen.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnZoomIn" class="tb" title="Zoom In" data-i18n-title="Zoom In" data-i18n-ctx="MainMenu"><img src="img/toolbar/scale-zoomin.png" alt=""></button>
        <button id="btnZoomOut" class="tb" title="Zoom Out" data-i18n-title="Zoom Out" data-i18n-ctx="MainMenu"><img src="img/toolbar/scale-zoomout.png" alt=""></button>
        <button id="btnZoomActual" class="tb" title="Actual Size" data-i18n-title="Actual Size" data-i18n-ctx="MainMenu"><img src="img/toolbar/scale-actualsize.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnDatabase" class="tb" title="Database" data-i18n-title="Database" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-database.png" alt=""></button>
        <button id="btnPlugins" class="tb" title="Plugin Manager" data-i18n-title="Plugin Manager" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-pluginmanager.png" alt=""></button>
        <button id="btnSoundTest" class="tb" title="Sound Test" data-i18n-title="Sound Test" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-soundtest.png" alt=""></button>
        <button id="btnEventSearch" class="tb" title="Event Searcher" data-i18n-title="Event Searcher" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-eventsearcher.png" alt=""></button>
        <button id="btnResources" class="tb" title="Resource Manager" data-i18n-title="Resource Manager" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-resourcemanager.png" alt=""></button>
        <button id="btnGenerator" class="tb" title="Character Generator" data-i18n-title="Character Generator" data-i18n-ctx="MainMenu" disabled><img src="img/toolbar/tools-charactergenerator.png" alt=""></button>
        <span class="sep"></span>
        <button id="btnPlay" class="tb" title="Playtest" data-i18n-title="Playtest" data-i18n-ctx="MainMenu"><img src="img/toolbar/game-playtest.png" alt=""></button>
        <span class="spacer"></span>
        <button id="btnGrid" class="tb toggle on" title="Map Grid" data-i18n-title="Map Grid" data-i18n-ctx="Group_MapGrid">#</button>
    </header>
    <main id="main">
        <!-- Coluna esquerda do MZ (01_03): paleta de tiles (ou Event List no modo evento) em cima,
             lista de mapas embaixo, com divisória arrastável (js/app.js bindLeftColumn) -->
        <div id="leftCol">
            <div id="leftTop"></div>
            <div id="leftSplit" role="separator" aria-orientation="horizontal"><span></span></div>
            <aside id="sidebar">
                <div class="sidebarTitle"><img src="img/tree-root.png" alt=""><span id="projectName">—</span></div>
                <ul id="mapTree"></ul>
            </aside>
        </div>
        <section id="viewport">
            <canvas id="mapCanvas"></canvas>
            <div id="emptyHint" data-i18n="Select a map">Select a map</div>
        </section>
    </main>
    <footer id="status">
        <span id="statusMap">—</span>
        <span id="statusPos"></span>
        <span class="spacer"></span>
        <span id="statusMsg"></span>
        <span id="zoomLabel">100%</span>
    </footer>

    <div id="playOverlay" hidden>
        <div id="playBar">
            <img src="img/toolbar/game-playtest.png" alt="" class="barIcon">
            <span data-i18n="Playtest" data-i18n-ctx="MainMenu">Playtest</span>
            <span class="spacer"></span>
            <button id="btnPlayDebug" title="Debug (F9)" data-i18n-title="Debug (F9)"><span data-i18n="Debug (F9)">Debug (F9)</span></button>
            <button id="btnPlayThrough" class="toggle" title="Through (Ctrl)" data-i18n-title="Through (Ctrl)"><span data-i18n="Through (Ctrl)">Through (Ctrl)</span></button>
            <button id="btnPlayFit" class="toggle" title="Fit the game resolution to the screen (no black bars)" data-i18n-title="Fit the game resolution to the screen (no black bars)"><span data-i18n="Fit to screen">Fit to screen</span></button>
            <button id="btnPlayFull" title="Full screen" data-i18n-title="Full screen">⛶</button>
            <button id="btnPlayReload" title="Restart" data-i18n-title="Restart">↻</button>
            <button id="btnPlayClose" title="Close" data-i18n-title="Close" data-i18n-ctx="BasicConstants">✕ <span data-i18n="Close" data-i18n-ctx="BasicConstants">Close</span></button>
        </div>
        <iframe id="playFrame" allow="autoplay; fullscreen" title="Game"></iframe>
    </div>

    <!-- Runtime do próprio projeto: o editor desenha mapas exatamente como o jogo. -->
    <script src="/project/js/libs/pixi.js"></script>
    <script src="/project/js/rmmz_core.js"></script>
    <script src="/project/js/rmmz_managers.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
