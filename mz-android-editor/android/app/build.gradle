plugins {
    id 'com.android.application'
}

android {
    namespace 'br.mz.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'br.mz.editor'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1-fase1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/editorAssets"
            assets.srcDirs += "$buildDir/playerAssets"
        }
    }
}

// Copia o editor web (../../editor) para assets/editor dentro do APK.
tasks.register('copyEditorAssets', Copy) {
    from rootProject.file('../editor')
    into layout.buildDirectory.dir('editorAssets/editor')
}
tasks.named('preBuild') {
    dependsOn 'copyEditorAssets'
}

// Implantação (Deployment): o APK do player (release, NÃO assinado) vira assets/player-template.apk.
// No aparelho o editor injeta assets/www/** do jogo, troca nome/pacote e assina com apksig.
dependencies {
    implementation 'com.android.tools.build:apksig:8.7.3'
}
tasks.register('copyPlayerTemplate', Copy) {
    dependsOn ':player:assembleRelease'
    from(project(':player').layout.buildDirectory.dir('outputs/apk/release')) {
        include '*-unsigned.apk'
        rename { 'player-template.apk' }
    }
    into layout.buildDirectory.dir('playerAssets')
}
tasks.named('preBuild') {
    dependsOn 'copyPlayerTemplate'
}
apply from: 'template.gradle'
